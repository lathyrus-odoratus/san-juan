name: CI

permissions:
  contents: read
  packages: write

# 分支策略：
#   main → 正式站（Production），面向團隊外使用者
#   dev  → 測試站（Staging），供團隊內開發驗證
# feature branch 完成後先合進 dev，dev 穩定後再合進 main

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match local dev (npm 11). The lockfile is generated by npm 11, whose
      # optional peer-dep pruning differs from npm 10 and breaks `npm ci`.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  build-and-push:
    name: Build & Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set GHCR image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/san-juan" >> "$GITHUB_ENV"

      # Login to your Private Registry
      - name: Login to NAS Registry
        run: |
          echo "${{ secrets.NAS_REGISTRY_PASSWORD }}" | docker login registry.parsons125.in -u "${{ secrets.NAS_REGISTRY_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.parsons125.in/san-juan:latest
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Trigger Webhook
      - name: Trigger NAS Redeploy
        run: |
          curl -sf -X POST "https://webhook.parsons125.in/hooks/redeploy-san-juan?token=${{ secrets.DEPLOY_TOKEN }}"
